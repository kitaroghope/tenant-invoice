name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set these under Settings -> Secrets and variables -> Actions in the GitHub repo.
          # Safe to expose in the built bundle — this is the anon/publishable key, not the
          # service role key, and RLS is what actually enforces access, same as in local dev.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # GitHub Pages serves this repo under /tenant-invoice/, not the domain root — see
          # vite.config.ts. The Apache/DirectAdmin build (npm run build with no override)
          # stays root-based, since that target is a real domain, not a repo subpath.
          DEPLOY_BASE: /tenant-invoice/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
