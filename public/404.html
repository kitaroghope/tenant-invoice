<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kita Invoice</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrite, so it serves this file for any unknown
      // path — which is every deep link into a client-routed SPA (e.g. /invoices/123).
      // This re-encodes the real path into a query string and redirects to the app root,
      // where the matching script in index.html decodes it back with history.replaceState
      // before React Router ever sees the URL. Standard technique: rafgraph/spa-github-pages.
      var pathSegmentsToKeep = 1 // "/tenant-invoice"
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
